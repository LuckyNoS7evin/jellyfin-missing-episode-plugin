<div id="missingEpisodesWidget" style="padding:1em;">
    <h3 style="margin:0 0 0.5em;">Missing Episodes</h3>
    <p id="missingEpisodesWidgetCount" style="font-size:2em; margin:0; font-weight:bold;">—</p>
    <p style="margin:0.25em 0 0.75em; color:#aaa;">episodes missing from library</p>
    <a is="emby-linkbutton" href="missingepisodes.html" class="raised button-submit emby-button" style="display:inline-block;">
        View Report
    </a>
</div>

<script type="text/javascript">
(function () {
    ApiClient.fetch({
        type: 'GET',
        url: ApiClient.getUrl('/MissingEpisodes/Count'),
        dataType: 'json'
    }).then(function (result) {
        var el = document.getElementById('missingEpisodesWidgetCount');
        if (el) {
            el.textContent = result.count != null ? result.count : '—';
        }
    }).catch(function (err) {
        console.error('Missing Episodes widget: failed to fetch count', err);
    });
})();
</script>
