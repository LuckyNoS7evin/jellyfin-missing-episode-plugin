<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Missing Episodes</title>
</head>
<body>
<div id="MissingEpisodesConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary">
            <form class="missingEpisodesConfigForm">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">Missing Episodes</h2>
                </div>
                <p>The list below shows episodes that Jellyfin has metadata for but are not present in your library files.</p>

                <div class="inputContainer" style="max-width:400px;">
                    <label for="librarySelect">Filter by Library:</label>
                    <select id="librarySelect" is="emby-select" class="emby-select-withcolor emby-select">
                        <option value="">All TV Libraries</option>
                    </select>
                </div>

                <div class="inputContainer" style="max-width:400px;">
                    <label for="searchInput">Filter results:</label>
                    <input type="text" id="searchInput" is="emby-input" />
                </div>

                <div>
                    <button is="emby-button" type="button" id="refreshBtn" class="raised button-submit block">
                        <span>Refresh</span>
                    </button>
                </div>

                <div id="loadingMsg" style="display:none; margin-top:1em;">
                    <p>Loading...</p>
                </div>

                <div id="summarySection" style="display:none; margin-top:1em;">
                    <p id="summaryText"></p>
                </div>

                <div id="noMissingMsg" style="display:none; margin-top:1em;">
                    <p>&#10003; No missing episodes found!</p>
                </div>

                <div id="resultsSection" style="display:none; margin-top:1em;"></div>
            </div>
            </form>
        </div>
    </div>
    <style>
        .me-series {
            margin-bottom: 0.6em;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
        }
        .me-series > summary {
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.05em;
            background: rgba(255,255,255,0.05);
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .me-series > summary::-webkit-details-marker { display: none; }
        .me-series > summary::before {
            content: '\25B6';
            font-size: 0.65em;
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .me-series[open] > summary::before { transform: rotate(90deg); }
        .me-seasons {
            padding: 8px 12px 12px;
        }
        .me-season {
            margin-bottom: 0.4em;
            border: 1px solid #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .me-season > summary {
            padding: 7px 12px;
            cursor: pointer;
            font-weight: 600;
            background: rgba(255,255,255,0.03);
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .me-season > summary::-webkit-details-marker { display: none; }
        .me-season > summary::before {
            content: '\25B6';
            font-size: 0.6em;
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .me-season[open] > summary::before { transform: rotate(90deg); }
        .me-count {
            font-weight: normal;
            opacity: 0.65;
            font-size: 0.88em;
        }
        .me-not-aired {
            font-size: 0.8em;
            color: #f0a030;
            font-weight: normal;
            font-style: italic;
        }
        .me-table {
            width: 100%;
            border-collapse: collapse;
            margin: 6px 8px 4px;
            width: calc(100% - 16px);
        }
        .me-table th {
            text-align: left;
            padding: 5px 8px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 0.82em;
            opacity: 0.75;
        }
        .me-table td {
            padding: 4px 8px;
            border-bottom: 1px solid #252525;
            font-size: 0.88em;
        }
        .me-table .col-ep { width: 70px; }
        .me-table .col-date { width: 120px; }
    </style>
    <script type="text/javascript">
        var MissingEpisodesConfig = {
            allEpisodes: [],

            escapeHtml: function (str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            },

            formatDate: function (dateStr) {
                if (!dateStr) return '';
                try { return new Date(dateStr).toLocaleDateString(); }
                catch (e) { return dateStr; }
            },

            isNotFullyAired: function (episodes) {
                var now = new Date();
                return episodes.some(function (ep) {
                    return ep.PremiereDate && new Date(ep.PremiereDate) > now;
                });
            },

            renderGrouped: function (episodes) {
                var container = document.getElementById('resultsSection');
                container.innerHTML = '';

                if (!episodes || episodes.length === 0) return;

                // Group: seriesMap[seriesName][seasonKey] = [episodes]
                var seriesMap = {};
                var seriesOrder = [];
                episodes.forEach(function (ep) {
                    if (!seriesMap[ep.SeriesName]) {
                        seriesMap[ep.SeriesName] = {};
                        seriesOrder.push(ep.SeriesName);
                    }
                    var sk = ep.SeasonNumber != null ? ep.SeasonNumber : -1;
                    if (!seriesMap[ep.SeriesName][sk]) {
                        seriesMap[ep.SeriesName][sk] = [];
                    }
                    seriesMap[ep.SeriesName][sk].push(ep);
                });

                seriesOrder.forEach(function (seriesName) {
                    var seasons = seriesMap[seriesName];
                    var totalCount = 0;
                    Object.keys(seasons).forEach(function (k) { totalCount += seasons[k].length; });

                    var seriesEl = document.createElement('details');
                    seriesEl.className = 'me-series';

                    var seriesSummary = document.createElement('summary');
                    seriesSummary.innerHTML =
                        MissingEpisodesConfig.escapeHtml(seriesName) +
                        '&nbsp;<span class="me-count">(' + totalCount + ' missing)</span>';
                    seriesEl.appendChild(seriesSummary);

                    var seasonsDiv = document.createElement('div');
                    seasonsDiv.className = 'me-seasons';

                    // Sort seasons: 0 (Specials) first, then 1,2,3..., unknown (-1) last
                    var seasonKeys = Object.keys(seasons).map(Number).sort(function (a, b) {
                        if (a === -1) return 1;
                        if (b === -1) return -1;
                        return a - b;
                    });

                    seasonKeys.forEach(function (sk) {
                        var eps = seasons[sk];
                        var label = sk === 0 ? 'Specials' : sk === -1 ? 'Unknown Season' : 'Season ' + sk;
                        var notAired = MissingEpisodesConfig.isNotFullyAired(eps);

                        var seasonEl = document.createElement('details');
                        seasonEl.className = 'me-season';

                        var seasonSummary = document.createElement('summary');
                        seasonSummary.innerHTML =
                            label +
                            '&nbsp;<span class="me-count">(' + eps.length + ' missing)</span>' +
                            (notAired ? '&ensp;<span class="me-not-aired">not fully aired</span>' : '');
                        seasonEl.appendChild(seasonSummary);

                        var table = document.createElement('table');
                        table.className = 'me-table';
                        var thead = document.createElement('thead');
                        thead.innerHTML =
                            '<tr>' +
                            '<th class="col-ep">Episode</th>' +
                            '<th>Title</th>' +
                            '<th class="col-date">Premiere Date</th>' +
                            '</tr>';
                        table.appendChild(thead);

                        var tbody = document.createElement('tbody');
                        eps.forEach(function (ep) {
                            var tr = document.createElement('tr');
                            tr.innerHTML =
                                '<td>' + (ep.EpisodeNumber != null ? 'E' + String(ep.EpisodeNumber).padStart(2, '0') : '?') + '</td>' +
                                '<td>' + MissingEpisodesConfig.escapeHtml(ep.EpisodeName) + '</td>' +
                                '<td>' + MissingEpisodesConfig.escapeHtml(MissingEpisodesConfig.formatDate(ep.PremiereDate)) + '</td>';
                            tbody.appendChild(tr);
                        });
                        table.appendChild(tbody);
                        seasonEl.appendChild(table);
                        seasonsDiv.appendChild(seasonEl);
                    });

                    seriesEl.appendChild(seasonsDiv);
                    container.appendChild(seriesEl);
                });
            },

            applyFilter: function (lower) {
                var filtered = MissingEpisodesConfig.allEpisodes.filter(function (ep) {
                    return (ep.SeriesName || '').toLowerCase().indexOf(lower) !== -1 ||
                        (ep.EpisodeName || '').toLowerCase().indexOf(lower) !== -1;
                });
                MissingEpisodesConfig.renderGrouped(filtered);
                var hasResults = filtered.length > 0;
                document.getElementById('resultsSection').style.display = hasResults ? '' : 'none';
                document.getElementById('noMissingMsg').style.display = hasResults ? 'none' : '';
                document.getElementById('summaryText').textContent =
                    filtered.length + ' missing episode' + (filtered.length !== 1 ? 's' : '') + ' found.';
            },

            loadLibraries: function () {
                ApiClient.getJSON(ApiClient.getUrl('MissingEpisodes/Libraries')).then(function (libraries) {
                    var select = document.getElementById('librarySelect');
                    while (select.options.length > 1) select.remove(1);
                    libraries.forEach(function (lib) {
                        var option = document.createElement('option');
                        option.value = lib.Id;
                        option.textContent = lib.Name;
                        select.appendChild(option);
                    });
                }).catch(function (err) {
                    console.error('[MissingEpisodes] Failed to load libraries:', err);
                });
            },

            loadEpisodes: function () {
                var libraryId = document.getElementById('librarySelect').value;
                var path = 'MissingEpisodes';
                if (libraryId) path += '?libraryId=' + encodeURIComponent(libraryId);

                document.getElementById('loadingMsg').style.display = '';
                document.getElementById('resultsSection').style.display = 'none';
                document.getElementById('noMissingMsg').style.display = 'none';
                document.getElementById('summarySection').style.display = 'none';
                document.getElementById('searchInput').value = '';

                ApiClient.getJSON(ApiClient.getUrl(path)).then(function (episodes) {
                    MissingEpisodesConfig.allEpisodes = episodes;
                    document.getElementById('loadingMsg').style.display = 'none';

                    if (!episodes || episodes.length === 0) {
                        document.getElementById('noMissingMsg').style.display = '';
                    } else {
                        document.getElementById('summaryText').textContent =
                            episodes.length + ' missing episode' + (episodes.length !== 1 ? 's' : '') + ' found.';
                        document.getElementById('summarySection').style.display = '';
                        MissingEpisodesConfig.renderGrouped(episodes);
                        document.getElementById('resultsSection').style.display = '';
                    }
                }).catch(function (err) {
                    document.getElementById('loadingMsg').style.display = 'none';
                    console.error('[MissingEpisodes] Failed to load episodes:', err);
                });
            }
        };

        document.getElementById('MissingEpisodesConfigPage').addEventListener('pageshow', function () {
            MissingEpisodesConfig.loadLibraries();
            MissingEpisodesConfig.loadEpisodes();

            document.getElementById('refreshBtn').addEventListener('click', function () {
                MissingEpisodesConfig.loadEpisodes();
            });

            document.getElementById('searchInput').addEventListener('input', function () {
                MissingEpisodesConfig.applyFilter(this.value.toLowerCase());
            });
        });
    </script>
</div>
</body>
</html>
